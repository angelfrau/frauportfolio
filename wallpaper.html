<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRAU's PORTFOLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17110C; --panel:#1F1812; --rule:#3A2D21;
    --ink:#EFE3CF; --muted:#A38F74; --faint:#6E5F4C;
    --gold:#D1A456; --up:#8DB07A; --down:#CC7A5E;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(80% 70% at 12% 0%, rgba(209,164,86,.07), transparent 60%),
      radial-gradient(60% 60% at 100% 100%, rgba(209,164,86,.04), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing:antialiased;
  }
  .stage{
    height:100vh; display:grid; grid-template-columns: minmax(380px, 38%) 1fr;
    gap: clamp(28px, 4vw, 90px);
    padding: clamp(28px, 6vh, 80px) clamp(28px, 5vw, 110px);
  }

  /* left */
  .left{ display:flex; flex-direction:column; min-height:0; }
  .title{ font-family:'Cormorant Garamond', Georgia, serif; font-style:italic; font-weight:700;
    font-size: clamp(26px, 2.3vw, 48px); letter-spacing:.01em; color:var(--muted); }
  .total{ font-family:'Cormorant Garamond', Georgia, serif; font-weight:700;
    font-size: clamp(56px, 6.4vw, 140px); line-height:.95; letter-spacing:-.01em; margin-top: clamp(14px, 3vh, 40px); }
  .periods{ display:grid; grid-template-columns: repeat(5, 1fr); margin-top: clamp(20px, 4vh, 44px);
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .period{ padding: 14px 0; }
  .period + .period{ border-left:1px solid var(--rule); padding-left: 14px; }
  .period .k{ font-size: 12px; color:var(--faint); }
  .period .v{ font-size: clamp(15px, 1.15vw, 22px); font-weight:600; margin-top: 4px; }

  .holdings{ margin-top: clamp(14px, 2.6vh, 32px); flex:1; min-height:0; display:flex; flex-direction:column; }
  .group-name{ font-size:12px; color:var(--faint); margin: 10px 10px 4px; display:flex; justify-content:space-between; }
  .row{ display:grid; grid-template-columns: 22px 64px 1fr 96px 60px; align-items:center; gap: 12px;
    padding: clamp(5px, .85vh, 10px) 10px; font-size: clamp(13px, .9vw, 16px); }
  .row .ic{ width:22px; height:22px; border-radius:50%; overflow:hidden; background:var(--panel); }
  .row .ic img{ width:100%; height:100%; object-fit:contain; }
  .row .tk{ font-weight:600; }
  .row canvas{ width:100%; height:26px; display:block; }
  .row .val{ color:var(--muted); text-align:right; }
  .row .chg{ text-align:right; font-weight:600; font-size:.92em; }

  /* right: global chart */
  .right{ display:flex; flex-direction:column; min-height:0; }
  .panel{ flex:1; display:flex; flex-direction:column; min-height:0; transition: opacity .6s ease; }
  .panel.out{ opacity:0; }
  .chart-head{ display:flex; align-items:flex-end; gap: clamp(24px, 3vw, 64px); }
  .range-name{ font-family:'Cormorant Garamond', Georgia, serif; font-weight:700; font-size: clamp(30px, 2.8vw, 58px); line-height:1; white-space:nowrap; margin-right:auto; }
  .stat .k{ font-size:12px; color:var(--faint); }
  .stat .v{ font-size: clamp(18px, 1.6vw, 30px); font-weight:600; margin-top:4px; }
  .chart{ position:relative; flex:1; min-height:180px; margin-top: clamp(18px, 3.5vh, 40px); }
  .chart canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .foot{ display:flex; align-items:center; gap:16px; margin-top:18px; font-size:12px; color:var(--faint); }
  .rail{ flex:1; height:2px; background:var(--rule); border-radius:2px; overflow:hidden; }
  .rail i{ display:block; height:100%; width:0; background:var(--gold); }
  @keyframes fill{ from{ width:0 } to{ width:100% } }

  .up{ color:var(--up); } .down{ color:var(--down); }
  @media (prefers-reduced-motion: reduce){ .panel{ transition:none; } }
</style>
</head>
<body>
<div class="stage">
  <section class="left">
    <div class="title">FRAU's PORTFOLIO</div>
    <div class="total" id="total">$0.00</div>
    <div class="periods">
      <div class="period"><div class="k">1 hour</div><div class="v" data-k="1h">—</div></div>
      <div class="period"><div class="k">24 hours</div><div class="v" data-k="24h">—</div></div>
      <div class="period"><div class="k">1 week</div><div class="v" data-k="1w">—</div></div>
      <div class="period"><div class="k">1 month</div><div class="v" data-k="1m">—</div></div>
      <div class="period"><div class="k">1 year</div><div class="v" data-k="1y">—</div></div>
    </div>
    <div class="holdings" id="holdings"></div>
  </section>

  <section class="right">
    <div class="panel" id="panel">
      <div class="chart-head">
        <div class="range-name" id="r-name">Last 24 hours</div>
        <div class="stat"><div class="k">Change</div><div class="v" id="r-chg">—</div></div>
        <div class="stat"><div class="k">High</div><div class="v" id="r-hi">—</div></div>
        <div class="stat"><div class="k">Low</div><div class="v" id="r-lo">—</div></div>
      </div>
      <div class="chart"><canvas id="chart"></canvas></div>
    </div>
    <div class="foot">
      <span id="next">Loading price history</span>
      <div class="rail"><i id="rail"></i></div>
      <span id="updated">Updating</span>
    </div>
  </section>
</div>

<script>
/* ============ DATA (keep holdings in sync with index.html) ============ */
const coins = [
  {ticker:'ALGO',   holdings:71868.925,  price:0.086,       cgId:'algorand',        cat:'alt'},
  {ticker:'DOT',    holdings:3583.10,    price:0.86,        cgId:'polkadot',        cat:'alt'},
  {ticker:'CRV',    holdings:12547.82,   price:0.206,       cgId:'curve-dao-token', cat:'alt'},
  {ticker:'CSPR',   holdings:725880,     price:0.0019,      cgId:'casper-network',  cat:'alt'},
  {ticker:'GALA',   holdings:45129,      price:0.0022,      cgId:'gala',            cat:'alt'},
  {ticker:'POPCAT', holdings:11953,      price:0.0484,      cgId:'popcat',          cat:'meme'},
  {ticker:'USA',    holdings:6121912246, price:0.000000221, cgId:'american-coin',   cat:'meme'},
  {ticker:'GOO',    holdings:3499676,    price:0.00009,     cgId:'silly-goose',     cat:'meme'},
  {ticker:'TREMP',  holdings:38765,      price:0.0043,      cgId:'donald-tremp',    cat:'meme'},
];
const BASE_EXTRA = 10000;              // private flat amount added to the displayed total
const RANGES = [
  {name:'Last 24 hours', ms:864e5},
  {name:'Last 7 days',   ms:7*864e5},
  {name:'Last 30 days',  ms:30*864e5},
];
const CYCLE_MS = 15000;                // time each range stays on screen
const PRICE_REFRESH_MS = 90000;
const HISTORY_REFRESH_MS = 30*60000;   // one 30-day history per coin, re-fetched every 30 min

const ICON_FALLBACKS = {
  algorand:'https://coin-images.coingecko.com/coins/images/4380/large/download.png',
  polkadot:'https://coin-images.coingecko.com/coins/images/12171/large/polkadot.png',
  'curve-dao-token':'https://coin-images.coingecko.com/coins/images/12124/large/Curve.png',
  'casper-network':'https://coin-images.coingecko.com/coins/images/16279/large/Casper_Symbol_CSPR_Black.png',
  gala:'https://coin-images.coingecko.com/coins/images/12493/large/GALA_token_image_-_200PNG.png',
  popcat:'https://coin-images.coingecko.com/coins/images/33760/large/image.jpg'
};
const PAPRIKA_IDS = {
  'casper-network':'cspr-casper-network', 'curve-dao-token':'crv-curve-dao-token',
  algorand:'algo-algorand', polkadot:'dot-polkadot', 'silly-goose':'goo-silly-goose',
  'donald-tremp':'tremp-doland-tremp', 'american-coin':'usa-american-coin',
  gala:'gala-gala', popcat:'popcat-popcat'
};

/* ============ HELPERS ============ */
const money = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (p, d=1) => (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(d) + '%';
const tone = p => p >= 0 ? 'up' : 'down';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const UP = '#8DB07A', DOWN = '#CC7A5E';
const iconHTML = c => { const s = c.icon || ICON_FALLBACKS[c.cgId]; return s ? `<img src="${s}" alt="" onerror="this.remove()">` : ''; };
function setChange(el, p, d=1){
  el.classList.remove('up','down');
  if(typeof p !== 'number' || !isFinite(p)){ el.textContent = '—'; return; }
  el.textContent = pct(p, d); el.classList.add(tone(p));
}
const liveTotal = () => coins.reduce((s,c) => s + c.holdings * c.price, 0) + BASE_EXTRA;

/* ============ LIVE PRICES ============ */
let lastUpdated = null;
async function refreshPrices(){
  const ids = coins.map(c => c.cgId).join(',');
  try{
    const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&price_change_percentage=1h,24h,7d,30d,1y`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const byId = {}; (await res.json()).forEach(d => byId[d.id] = d);
    const missing = [];
    coins.forEach(c => {
      const d = byId[c.cgId];
      if(d && typeof d.current_price === 'number'){
        c.price = d.current_price; if(d.image) c.icon = d.image;
        c.chg = { '1h':d.price_change_percentage_1h_in_currency, '24h':d.price_change_percentage_24h_in_currency,
                  '1w':d.price_change_percentage_7d_in_currency, '1m':d.price_change_percentage_30d_in_currency,
                  '1y':d.price_change_percentage_1y_in_currency };
      }else missing.push(c);
    });
    if(missing.length) await fromPaprika(missing);
    lastUpdated = new Date();
  }catch(e){ await fromPaprika(coins); }
}
async function fromPaprika(list){
  let ok = false;
  await Promise.all(list.map(async c => {
    const id = PAPRIKA_IDS[c.cgId]; if(!id) return;
    try{
      const r = await fetch(`https://api.coinpaprika.com/v1/tickers/${id}`); if(!r.ok) return;
      const q = (await r.json()).quotes?.USD;
      if(q && typeof q.price === 'number'){
        c.price = q.price; ok = true;
        c.chg = { '1h':q.percent_change_1h, '24h':q.percent_change_24h, '1w':q.percent_change_7d, '1m':q.percent_change_30d, '1y':q.percent_change_1y };
      }
    }catch(e){}
  }));
  if(ok) lastUpdated = new Date();
}

/* ============ PRICE HISTORY (one call per coin: 30 days, hourly) ============ */
let historyLoaded = 0;
async function fetchHistory(c){
  for(let attempt = 0; attempt < 4; attempt++){
    try{
      const r = await fetch(`https://api.coingecko.com/api/v3/coins/${c.cgId}/market_chart?vs_currency=usd&days=30`);
      if(r.status === 429){ await sleep(3000 + attempt * 2500); continue; }
      if(!r.ok) return;
      let s = ((await r.json()).prices || []).map(([t,p]) => ({t, p})).filter(x => isFinite(x.p) && x.p > 0);
      while(s.length >= 3){ const a = s[s.length-1].p, b = s[s.length-2].p; if(a < b*.35 || a > b*3) s = s.slice(0,-1); else break; }
      if(s.length >= 2) c.hist = s;
      return;
    }catch(e){ await sleep(1500); }
  }
}
async function loadHistory(){
  historyLoaded = 0;
  for(const c of coins){
    await fetchHistory(c);
    historyLoaded++;
    renderLeft();                                   // sparklines appear one by one
    if(!cycling) document.getElementById('next').textContent = `Loading price history (${historyLoaded} of ${coins.length})`;
    await sleep(1500);                              // stay well under the free API limit
  }
}

// price of a coin at time t, interpolated from its history (falls back to the live price)
function priceAt(c, t){
  const h = c.hist; if(!h) return c.price;
  if(t <= h[0].t) return h[0].p;
  if(t >= h[h.length-1].t) return c.price;
  let lo = 0, hi = h.length - 1;
  while(hi - lo > 1){ const m = (lo + hi) >> 1; if(h[m].t <= t) lo = m; else hi = m; }
  const k = (t - h[lo].t) / (h[hi].t - h[lo].t);
  return h[lo].p + (h[hi].p - h[lo].p) * k;
}
function globalSeries(ms){
  const now = Date.now(), start = now - ms, n = ms <= 864e5 ? 48 : ms <= 7*864e5 ? 168 : 240;
  const out = [];
  for(let i = 0; i < n; i++){
    const t = start + (ms * i) / (n - 1);
    out.push({t, v: BASE_EXTRA + coins.reduce((s,c) => s + c.holdings * priceAt(c, t), 0)});
  }
  out[out.length-1] = {t: now, v: liveTotal()};
  return out;
}

/* ============ LEFT PANEL ============ */
const totalEl = document.getElementById('total');
let shownTotal = 0;
function tweenTotal(to){
  const from = shownTotal, t0 = performance.now(), dur = 900;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    totalEl.textContent = money(from + (to - from) * e);
    if(k < 1) requestAnimationFrame(step); else shownTotal = to;
  };
  requestAnimationFrame(step);
}

function drawSpark(cv, c){
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  if(!c.hist) return;
  const cut = Date.now() - 7*864e5;
  const s = c.hist.filter(x => x.t >= cut).map(x => x.p); s.push(c.price);
  if(s.length < 2) return;
  const min = Math.min(...s), max = Math.max(...s), span = (max - min) || 1, pad = 2*dpr;
  const color = s[s.length-1] >= s[0] ? UP : DOWN;
  g.beginPath();
  s.forEach((v, i) => { const x = W * i / (s.length-1), y = H - pad - (H - 2*pad) * (v - min) / span; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = color; g.lineWidth = 1.5 * dpr; g.lineJoin = 'round'; g.stroke();
}

function renderLeft(){
  const total = liveTotal();
  if(Math.abs(total - shownTotal) > 0.005) tweenTotal(total);

  ['1h','24h','1w','1m','1y'].forEach(k => {
    let past = 0, now = 0;
    coins.forEach(c => {
      const x = c.chg && c.chg[k], v = c.holdings * c.price;
      if(typeof x === 'number' && isFinite(x) && 1 + x/100 > 0){ past += v / (1 + x/100); now += v; }
    });
    if(now > 0){ past += BASE_EXTRA; now += BASE_EXTRA; }
    setChange(document.querySelector(`.period .v[data-k="${k}"]`), past > 0 ? (now - past) / past * 100 : NaN);
  });

  const box = document.getElementById('holdings'); box.innerHTML = '';
  [['alt','Alt coins'],['meme','Memecoins']].forEach(([cat, label]) => {
    const list = coins.filter(c => c.cat === cat);
    const g = document.createElement('div'); g.className = 'group-name';
    g.innerHTML = `<span>${label}</span><span>${money(list.reduce((s,c) => s + c.holdings * c.price, 0))}</span>`;
    box.appendChild(g);
    list.forEach(c => {
      const ch = c.chg && c.chg['24h'];
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = `<div class="ic">${iconHTML(c)}</div><div class="tk">${c.ticker}</div><canvas></canvas>
        <div class="val">${money(c.holdings * c.price)}</div>
        <div class="chg ${typeof ch === 'number' ? tone(ch) : ''}">${typeof ch === 'number' ? pct(ch) : '—'}</div>`;
      box.appendChild(r);
      drawSpark(r.querySelector('canvas'), c);
    });
  });

  document.getElementById('updated').textContent = lastUpdated
    ? 'Updated ' + lastUpdated.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : 'Waiting for prices';
}

/* ============ BIG GLOBAL CHART ============ */
const canvas = document.getElementById('chart'), ctx = canvas.getContext('2d');
let animId = null, onScreen = null;

function sizeCanvas(){ const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1; canvas.width = Math.max(1, r.width*d); canvas.height = Math.max(1, r.height*d); }

function paint(series, color, progress, ms){
  const W = canvas.width, H = canvas.height, d = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, W, H);
  const padT = 10*d, padB = 26*d, padR = 12*d;
  const vals = series.map(p => p.v), min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const x = i => (W - padR) * i / (series.length - 1);
  const y = v => H - padB - (H - padT - padB) * (v - min) / span;

  ctx.strokeStyle = 'rgba(163,143,116,.10)'; ctx.lineWidth = d;
  for(let g = 0; g < 3; g++){ const gy = padT + (H - padT - padB) * g / 2; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }

  // time labels along the bottom
  ctx.fillStyle = '#6E5F4C'; ctx.font = `${12*d}px Inter, sans-serif`; ctx.textBaseline = 'bottom';
  const fmtT = t => ms <= 864e5
    ? new Date(t).toLocaleTimeString('en-US', {hour:'numeric'})
    : new Date(t).toLocaleDateString('en-US', {month:'short', day:'numeric'});
  [0, .25, .5, .75, 1].forEach(f => {
    const i = Math.round(f * (series.length - 1));
    ctx.textAlign = f === 0 ? 'left' : f === 1 ? 'right' : 'center';
    ctx.fillText(f === 1 ? 'Now' : fmtT(series[i].t), f === 1 ? W - padR : x(i), H);
  });

  const last = Math.max(1, Math.floor(progress * (series.length - 1)));
  const path = () => { ctx.beginPath(); for(let i = 0; i <= last; i++){ i ? ctx.lineTo(x(i), y(series[i].v)) : ctx.moveTo(0, y(series[0].v)); } };
  const grad = ctx.createLinearGradient(0, padT, 0, H - padB);
  grad.addColorStop(0, color + '38'); grad.addColorStop(1, color + '00');
  path(); ctx.lineTo(x(last), H - padB); ctx.lineTo(0, H - padB); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
  path(); ctx.strokeStyle = color; ctx.lineWidth = 2.4*d; ctx.lineJoin = 'round'; ctx.stroke();

  const lx = x(last), ly = y(series[last].v);
  ctx.beginPath(); ctx.arc(lx, ly, 9*d, 0, Math.PI*2); ctx.fillStyle = color + '30'; ctx.fill();
  ctx.beginPath(); ctx.arc(lx, ly, 4*d, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
}

function showRange(i, animate){
  const R = RANGES[i], series = globalSeries(R.ms);
  const first = series[0].v, last = series[series.length-1].v;
  const color = last >= first ? UP : DOWN;
  document.getElementById('r-name').textContent = R.name;
  setChange(document.getElementById('r-chg'), (last - first) / first * 100, 2);
  document.getElementById('r-hi').textContent = money(Math.max(...series.map(p => p.v)));
  document.getElementById('r-lo').textContent = money(Math.min(...series.map(p => p.v)));
  document.getElementById('next').textContent = 'Next: ' + RANGES[(i + 1) % RANGES.length].name.toLowerCase();

  cancelAnimationFrame(animId); sizeCanvas();
  onScreen = {series, color, ms:R.ms};
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!animate || reduce){ paint(series, color, 1, R.ms); return; }
  const t0 = performance.now(), dur = 1500;
  const step = now => { const k = Math.min(1, (now - t0) / dur); paint(series, color, 1 - Math.pow(1 - k, 3), R.ms); if(k < 1) animId = requestAnimationFrame(step); };
  animId = requestAnimationFrame(step);
}
window.addEventListener('resize', () => {
  if(onScreen){ sizeCanvas(); paint(onScreen.series, onScreen.color, 1, onScreen.ms); }
  document.querySelectorAll('.row canvas').forEach((cv, i) => drawSpark(cv, coins.filter(c=>c.cat==='alt').concat(coins.filter(c=>c.cat==='meme'))[i]));
});

/* ============ CYCLE THROUGH RANGES ============ */
let rangeIdx = 0, cycling = false;
const panel = document.getElementById('panel');
function restartRail(){ const r = document.getElementById('rail'); r.style.animation = 'none'; void r.offsetWidth; r.style.animation = `fill ${CYCLE_MS}ms linear forwards`; }
function cycle(){
  cycling = true; restartRail();
  setTimeout(async () => {
    panel.classList.add('out'); await sleep(600);
    rangeIdx = (rangeIdx + 1) % RANGES.length;
    showRange(rangeIdx, true); panel.classList.remove('out');
    cycle();
  }, CYCLE_MS);
}

/* ============ START ============ */
renderLeft();
(async () => {
  await refreshPrices();
  renderLeft();
  showRange(0, false);                 // flat live line until history arrives
  await loadHistory();
  showRange(0, true);
  cycle();
})();
setInterval(async () => {
  await refreshPrices(); renderLeft();
  if(onScreen){                        // update the live end of the current chart without re-animating
    onScreen.series[onScreen.series.length-1] = {t: Date.now(), v: liveTotal()};
    paint(onScreen.series, onScreen.color, 1, onScreen.ms);
  }
}, PRICE_REFRESH_MS);
setInterval(loadHistory, HISTORY_REFRESH_MS);
</script>
</body>
</html>
